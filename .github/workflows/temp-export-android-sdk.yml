name: Temporary Android SDK Export

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDKM=""
          for p in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools"/*/bin/sdkmanager "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$p" ]; then SDKM="$p"; break; fi
          done
          test -n "$SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install 'platforms;android-36' 'build-tools;36.0.0'
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          mkdir -p sdk-export/platforms/android-36 sdk-export/build-tools
          cp "$ANDROID_HOME/platforms/android-36/android.jar" sdk-export/platforms/android-36/
          cp -R "$ANDROID_HOME/build-tools/36.0.0" sdk-export/build-tools/
      - uses: actions/upload-artifact@v4
        with:
          name: android-api36-build-tools
          path: sdk-export/
          retention-days: 1
