# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Server base URL — override in local.properties (not committed) or via -P flag:
#   ./gradlew assembleDebug -PSERVER_BASE_URL=https://your-server.example.com
# Default points to Android emulator's loopback host.
SERVER_BASE_URL=http://10.0.2.2:3000

# Twilio identity sent to the /token endpoint. Override as needed.
TWILIO_IDENTITY=alice
