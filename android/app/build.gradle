apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.ruko.voiceagent'
    compileSdk 34

    defaultConfig {
        applicationId "com.ruko.voiceagent"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            // Development: reach a local token server over HTTP. Cleartext
            // traffic to this host is explicitly allowed in
            // network_security_config.xml (Android emulator host alias).
            buildConfigField "String", "TOKEN_SERVER_URL", '"http://10.0.2.2:3000"'
        }
        release {
            minifyEnabled false
            // Production: always use HTTPS. Cleartext traffic is denied
            // globally for release builds via network_security_config.xml.
            buildConfigField "String", "TOKEN_SERVER_URL", '"https://api.ruko-voice.example.com"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
