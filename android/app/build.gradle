plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.ruko.voiceagent'
    compileSdk 34

    defaultConfig {
        applicationId "com.ruko.voiceagent"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Override TOKEN_SERVER_URL via local.properties or a Gradle build arg.
        // Default points to localhost on the Android emulator (10.0.2.2 = host machine).
        buildConfigField "String", "TOKEN_SERVER_URL", '"http://10.0.2.2:3000"'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }
}

dependencies {
    // Twilio Voice SDK — check https://www.twilio.com/docs/voice/sdk/android for latest version
    implementation 'com.twilio:voice-android:6.5.0'

    // Firebase (BOM manages all Firebase library versions)
    implementation platform('com.google.firebase:firebase-bom:32.7.1')
    implementation 'com.google.firebase:firebase-messaging'

    // Kotlin coroutines for background work
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // AndroidX / Material
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
